#
# dogfood-gate.yml — Hyperpolymath Dogfooding Quality Gate
# Validates that the repo uses hyperpolymath's own formats and tools.
# Companion to static-analysis-gate.yml (security) and fork-governance.yml (PR
# DEED/K9/Hypatia lanes + unified grid comment).
name: Dogfood Gate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: DEED conformance on push (pull_request runs in fork-governance.yml
  # per metadatastician/standards 3-practice/fork-governance/ADOPTION.adoc §3).
  # ---------------------------------------------------------------------------
  deed-validate:
    name: Validate DEED manifests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout canonical DEED validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: 8e48b1caade08a552646adeab66558ac43b4360d
          path: .standards-deed
          sparse-checkout: 1-formats/deed
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'
      - name: Run DEED validation hook
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/standards-deed"
          mv "$PWD/.standards-deed" "$RUNNER_TEMP/standards-deed"
          STANDARDS_DIR="$RUNNER_TEMP/standards-deed" bash .github/hooks/validate-deed.sh

  # ---------------------------------------------------------------------------
  # Job 2: K9 conformance on push (pull_request runs in fork-governance.yml).
  # ---------------------------------------------------------------------------
  k9-validate:
    name: Validate K9 contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NICKEL_VERSION: '1.18.0'
      NICKEL_SHA256: '9cba4dd65ae9915ec61f73033aafcff307a377665a83fd8f530df086763318cb'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout canonical K9 validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: 8e48b1caade08a552646adeab66558ac43b4360d
          path: .standards-k9
          sparse-checkout: 1-formats/k9
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Install sha256-verified Nickel CLI
        run: |
          set -euo pipefail
          URL="https://github.com/tweag/nickel/releases/download/${NICKEL_VERSION}/nickel-x86_64-linux"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/nickel" "$URL"
          echo "${NICKEL_SHA256}  ${RUNNER_TEMP}/nickel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/nickel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run K9 validation hook
        id: validate
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/standards-k9"
          mv "$PWD/.standards-k9" "$RUNNER_TEMP/standards-k9"
          STANDARDS_DIR="$RUNNER_TEMP/standards-k9" bash .github/hooks/validate-k9.sh

      - name: Generate K9 badge
        if: always()
        env:
          K9_RESULT: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k9-grid"
          jq -cn --arg result "$K9_RESULT" '{
            schemaVersion: 1,
            label: "K9",
            message: $result,
            color: (if $result == "success" then "brightgreen" else "red" end)
          }' > "$RUNNER_TEMP/k9-grid/badge.json"

      - name: Upload K9 grid
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid/badge.json
          if-no-files-found: error

  # The live README badge: badge.json (shields endpoint schema) published to
  # the governance-badges branch on every push to main, through the contents
  # API so the commit is GitHub-signed and no checkout is written to.
  badges:
    name: Publish the lane badges
    needs: k9-validate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.k9-validate.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the grid
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Publish badges/k9.json to the governance-badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE: ${{ runner.temp }}/k9-grid/badge.json
          BRANCH: governance-badges
          DEST: badges/k9.json
        run: |
          set -euo pipefail
          if [ ! -s "$BADGE" ]; then
            echo "::error::the k9-grid artifact holds no badge.json"
            exit 1
          fi
          jq -e 'type == "object" and has("schemaVersion")' "$BADGE" >/dev/null
          content="$(base64 -w0 "$BADGE")"
          message="badges: K9 grid at ${GITHUB_SHA:0:12}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$DEST?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
            jq -n --arg c "$content" --arg s "$sha" --arg b "$BRANCH" --arg m "$message" \
              '{message: $m, content: $c, branch: $b} + (if $s != "" then {sha: $s} else {} end)' > "$RUNNER_TEMP/put.json"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$DEST" --input "$RUNNER_TEMP/put.json" >/dev/null
          else
            jq -n --arg c "$content" '{content: $c, encoding: "base64"}' > "$RUNNER_TEMP/blob.json"
            blob="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)"
            jq -n --arg b "$blob" --arg p "$DEST" '{tree: [{path: $p, mode: "100644", type: "blob", sha: $b}]}' > "$RUNNER_TEMP/tree.json"
            tree="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree.json" --jq .sha)"
            jq -n --arg t "$tree" --arg m "$message" '{message: $m, tree: $t, parents: []}' > "$RUNNER_TEMP/commit.json"
            commit="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" --input "$RUNNER_TEMP/commit.json" --jq .sha)"
            jq -n --arg s "$commit" --arg r "refs/heads/$BRANCH" '{ref: $r, sha: $s}' > "$RUNNER_TEMP/ref.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/ref.json" >/dev/null
          fi
          echo "published $DEST on $BRANCH"

  # ---------------------------------------------------------------------------
  # Job 3: Empty-linter — invisible character detection
  # ---------------------------------------------------------------------------
  empty-lint:
    name: "🔴 GATE: Empty-linter (invisible characters)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for invisible characters
        id: lint
        run: |
          RESULTS_FILE="$RUNNER_TEMP/empty-lint-results.bin"
          BLOCKING_FILE="$RUNNER_TEMP/empty-lint-blocking-results.bin"
          if ! scripts/check-invisible-characters.sh \
              "$GITHUB_WORKSPACE" "$RESULTS_FILE" "$BLOCKING_FILE"; then
            echo "::error::Invisible-character scanner failed; refusing a partial pass"
            exit 2
          fi

          FINDINGS=0
          while IFS= read -r -d '' filepath; do
            FINDINGS=$((FINDINGS + 1))
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            SAFE_PATH="${REL_PATH//'%'/'%25'}"
            SAFE_PATH="${SAFE_PATH//$'\r'/'%0D'}"
            SAFE_PATH="${SAFE_PATH//$'\n'/'%0A'}"
            SAFE_PATH="${SAFE_PATH//':'/'%3A'}"
            SAFE_PATH="${SAFE_PATH//','/'%2C'}"
            echo "::warning file=${SAFE_PATH}::Invisible Unicode or C0 characters detected"
          done < "$RESULTS_FILE"

          BLOCKING=0
          while IFS= read -r -d '' filepath; do
            BLOCKING=$((BLOCKING + 1))
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            SAFE_PATH="${REL_PATH//'%'/'%25'}"
            SAFE_PATH="${SAFE_PATH//$'\r'/'%0D'}"
            SAFE_PATH="${SAFE_PATH//$'\n'/'%0A'}"
            SAFE_PATH="${SAFE_PATH//':'/'%3A'}"
            SAFE_PATH="${SAFE_PATH//','/'%2C'}"
            echo "::error file=${SAFE_PATH}::C0 control character or NUL byte detected"
          done < "$BLOCKING_FILE"

          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

          if [ "$BLOCKING" -gt 0 ]; then
            echo "## Empty-linter: BLOCKED — $BLOCKING file(s) contain C0/NUL corruption" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Write summary
        env:
          READY: ${{ steps.lint.outputs.ready }}
          FINDINGS: ${{ steps.lint.outputs.findings }}
        run: |
          if [ "$READY" = "true" ]; then
            if [ "${FINDINGS:-0}" -gt 0 ] 2>/dev/null; then
              echo "## Empty-Linter Results" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Found **${FINDINGS}** invisible character issue(s). See annotations above." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## Empty-Linter Results" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo ":white_check_mark: No invisible character issues found." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Empty-Linter" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: empty-linter not available." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 4: Groove manifest check (for repos that should expose services)
  # ---------------------------------------------------------------------------
  groove-check:
    name: "🟡 CHECK: Groove manifest check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Groove manifest
        id: groove
        run: |
          HAS_MANIFEST="false"
          HAS_GROOVE_CODE="false"

          MANIFEST=""
          if [ -f "www/.well-known/groove/manifest.json" ]; then
            MANIFEST="www/.well-known/groove/manifest.json"
          elif [ -f ".well-known/groove/manifest.json" ]; then
            MANIFEST=".well-known/groove/manifest.json"
            echo "::warning::Groove manifest at legacy root .well-known/ — canonical location is www/.well-known/ (run scripts/migrate-wellknown-to-www.sh)"
          fi

          if [ -n "$MANIFEST" ]; then
            HAS_MANIFEST="true"
            if ! jq empty "$MANIFEST" 2>/dev/null; then
              echo "::error file=$MANIFEST::Invalid JSON in Groove manifest"
              exit 1
            else
              SVC_ID=$(jq -r '.service_id // "unknown"' "$MANIFEST")
              echo "service_id=$SVC_ID" >> "$GITHUB_OUTPUT"
            fi
          fi

          if grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' --include='*.res' . 2>/dev/null | head -1 | grep -q .; then
            HAS_GROOVE_CODE="true"
          fi

          HAS_SERVER="false"
          if grep -rl 'Bandit\|Plug.Cowboy\|httpz\|vweb\|axum::serve\|actix_web\|hyper::Server\|rocket::build\|warp::serve' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' . 2>/dev/null | head -1 | grep -q .; then
            HAS_SERVER="true"
          fi

          echo "has_manifest=$HAS_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "has_groove_code=$HAS_GROOVE_CODE" >> "$GITHUB_OUTPUT"
          echo "has_server=$HAS_SERVER" >> "$GITHUB_OUTPUT"

          if [ "$HAS_SERVER" = "true" ] && [ "$HAS_MANIFEST" = "false" ] && [ "$HAS_GROOVE_CODE" = "false" ]; then
            echo "::warning::This repo has server code but no Groove endpoint. Add www/.well-known/groove/manifest.json for service discovery."
          fi

      - name: Write summary
        env:
          HAS_MANIFEST: ${{ steps.groove.outputs.has_manifest }}
          HAS_GROOVE_CODE: ${{ steps.groove.outputs.has_groove_code }}
          HAS_SERVER: ${{ steps.groove.outputs.has_server }}
        run: |
          {
            echo "## Groove Protocol Check"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Static manifest (www/.well-known/groove/manifest.json) | ${HAS_MANIFEST} |"
            echo "| Groove endpoint in code | ${HAS_GROOVE_CODE} |"
            echo "| Has HTTP server code | ${HAS_SERVER} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 5: eclexiaiser manifest validation
  # ---------------------------------------------------------------------------
  eclexiaiser-validate:
    name: Validate eclexiaiser manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and validate eclexiaiser manifest
        id: eclex
        run: |
          if [ ! -f "eclexiaiser.toml" ]; then
            if [ -f "Containerfile" ]; then
              echo "::warning::Containerfile present but no eclexiaiser.toml. Run \`eclexiaiser init\` to scaffold energy/carbon budgets."
            fi
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          err=0
          grep -qE '^[[:space:]]*\[project\]'        eclexiaiser.toml || { echo "::error file=eclexiaiser.toml::[project] section is required"; err=1; }
          grep -qE '^[[:space:]]*name[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || { echo "::error file=eclexiaiser.toml::a non-empty name is required"; err=1; }
          grep -qE '^[[:space:]]*\[\[functions\]\]'  eclexiaiser.toml || { echo "::error file=eclexiaiser.toml::at least one [[functions]] entry is required"; err=1; }
          if [ "$err" -ne 0 ]; then
            exit 1
          fi
          fns=$(grep -cE '^[[:space:]]*\[\[functions\]\]' eclexiaiser.toml)
          echo "Valid: eclexiaiser.toml structure present (${fns} function block(s))"

      - name: Write summary
        env:
          HAS_MANIFEST: ${{ steps.eclex.outputs.has_manifest }}
        run: |
          if [ "$HAS_MANIFEST" = "true" ]; then
            echo "## Eclexiaiser Manifest" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo ":white_check_mark: **eclexiaiser.toml** present and valid." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Eclexiaiser Manifest" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo ":ballot_box_with_check: No eclexiaiser.toml. Add one with \`eclexiaiser init\` for energy/carbon tracking." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 6: Canon lockstep — does this template still implement the canon?
  # ---------------------------------------------------------------------------
  canon-lockstep:
    name: Canon lockstep
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch the canon's released identity
        id: canon
        run: |
          set -euo pipefail
          LOCK="$RUNNER_TEMP/canon.lock"
          URL="https://raw.githubusercontent.com/metadatastician/standards/main/canon.lock"
          if ! curl -fsSL --retry 3 --max-time 30 "$URL" -o "$LOCK"; then
            echo "::error::could not fetch canon.lock from $URL"
            exit 1
          fi
          rec="$(awk '
            /^[[:space:]]*#/ { next }
            /^criteria[[:space:]]*=/ { on=1 }
            on {
              line=$0; sub(/#.*/,"",line); rec = rec " " line
              if (line ~ /}/) { on=0 }
            }
            END { print rec }' "$LOCK")"
          want="$(printf '%s\n' "$rec" \
            | grep -oE 'sha256[[:space:]]*=[[:space:]]*"[0-9a-f]{64}"' \
            | grep -oE '[0-9a-f]{64}' | head -1)"
          if [ -z "$want" ]; then
            echo "::error::canon.lock carries no criteria sha256"
            exit 1
          fi
          echo "want=$want" >> "$GITHUB_OUTPUT"

      - name: Compare this repo's declared pin
        env:
          WANT: ${{ steps.canon.outputs.want }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEED_NAME="${REPO#*/}_chora.deed"
          DEED="$RUNNER_TEMP/repo.deed"
          API="https://api.github.com/repos/${REPO}/contents/${DEED_NAME}?ref=${HEAD_SHA}"
          if ! curl -fsSL --retry 3 --max-time 30 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" -o "$DEED"; then
            echo "::error::no $DEED_NAME at ${HEAD_SHA:0:7} — this repo cannot declare a canon pin"
            exit 1
          fi
          echo "deed: $DEED_NAME @ ${HEAD_SHA:0:7}"

          deed_canon() {
              _clauses="$(awk 'BEGIN { bs = sprintf("%c", 92); dq = sprintf("%c", 34) } { o = ""; q = 0; for (i = 1; i <= length($0); i++) { c = substr($0, i, 1); if (q && c == bs) { o = o c substr($0, i + 1, 1); i++; continue } if (c == dq) q = !q; else if (!q && c == ";") break; o = o c } printf "%s ", o }' "$2" | grep -oE '[(]canon[[:space:]][^()]*[)]')" || true
              _n="$(echo "$_clauses" | grep -c '(canon' || true)"
              if [ "$_n" != "1" ]; then
                  echo "deed_canon: $2 carries ${_n:-0} (canon …) clauses, need exactly 1" >&2
                  return 0
              fi
              echo "$_clauses" | grep -oE ':'"$1"'[[:space:]]+"[^"]*"' | head -1 | sed -E 's/^[^"]*"//; s/"$//' || true
          }
          canon_key() {
            awk -v key="$1" '
              /^[[:space:]]*#/ { next }
              /^\[/ { f = ($0 == "[canon]") ? 1 : 0; next }
              f && $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub(/^[^=]*=[[:space:]]*/, ""); gsub(/^["[:space:]]+|["[:space:]]+$/, ""); print; exit
              }' "$2"
          }
          artefact_hash() {
            awk -v key="$1" '
              $0 ~ "^" key "[[:space:]]*=" { f = 1 }
              f { buf = buf " " $0 }
              f && /sha256[[:space:]]*=/ { print buf; exit }
            ' "$2" | grep -oE '[0-9a-f]{64}' | head -1
          }

          want_crit="$WANT"
          want_gates="$(artefact_hash gates "$RUNNER_TEMP/canon.lock")"
          want_ver="$(canon_key version "$RUNNER_TEMP/canon.lock")"
          got_crit="$(deed_canon criteria-sha256 "$DEED")"
          got_gates="$(deed_canon gates-sha256 "$DEED")"
          got_ver="$(deed_canon version "$DEED")"

          for pair in "want_crit:$want_crit" "want_gates:$want_gates" \
                      "got_crit:$got_crit" "got_gates:$got_gates"; do
            if ! printf '%s' "${pair#*:}" | grep -qxE '[0-9a-f]{64}'; then
              echo "::error::${pair%%:*} is not a sha256 (got '${pair#*:}') — refusing to compare"
              exit 1
            fi
          done
          for pair in "want_ver:$want_ver" "got_ver:$got_ver"; do
            if ! printf '%s' "${pair#*:}" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::${pair%%:*} is not a semver (got '${pair#*:}') — refusing to compare"
              exit 1
            fi
          done

          ok=1
          row() {
            mark=":x:"
            if [ "$2" = "$3" ]; then mark=":white_check_mark:"; else ok=0; fi
            printf '| `%s` | `%s` | `%s` | %s |\n' "$1" "${2:0:16}" "${3:0:16}" "$mark"
          }
          {
            echo "## Canon lockstep"
            echo ""
            echo "| pin | canon.lock asserts | \`$DEED_NAME\` declares | |"
            echo "|---|---|---|---|"
            row version         "$want_ver"   "$got_ver"
            row criteria-sha256 "$want_crit"  "$got_crit"
            row gates-sha256    "$want_gates" "$got_gates"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ok" = "1" ]; then
            echo ":white_check_mark: This template implements the canon at HEAD."
            exit 0
          fi
          echo "::error::canon lockstep broken — the template does not implement the canon at HEAD"
          exit 1

  # ---------------------------------------------------------------------------
  # Job 7: Dogfooding summary
  # ---------------------------------------------------------------------------
  dogfood-summary:
    name: "ℹ️ ADVISORY: Dogfooding compliance summary (non-gating)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [deed-validate, k9-validate, empty-lint, groove-check, eclexiaiser-validate, canon-lockstep]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate dogfooding scorecard
        run: |
          SCORE=0
          MAX=6
          if find . -name '*.deed' -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); DEED_STATUS=":white_check_mark:"
          else
            DEED_STATUS=":x:"
          fi
          if find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); K9_STATUS=":white_check_mark:"
          else
            K9_STATUS=":x:"
          fi
          if [ -f ".editorconfig" ]; then
            SCORE=$((SCORE + 1)); EC_STATUS=":white_check_mark:"
          else
            EC_STATUS=":x:"
          fi
          if [ -f "www/.well-known/groove/manifest.json" ] || [ -f ".well-known/groove/manifest.json" ] || grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); GROOVE_STATUS=":white_check_mark:"
          else
            GROOVE_STATUS=":ballot_box_with_check:"
          fi
          if grep -rl 'verisimdb\|VeriSimDB' --include='*.toml' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.rs' --include='*.ex' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); VSDB_STATUS=":white_check_mark:"
          else
            VSDB_STATUS=":ballot_box_with_check:"
          fi
          if [ -f "eclexiaiser.toml" ]; then
            SCORE=$((SCORE + 1)); ECLEX_STATUS=":white_check_mark:"
          else
            ECLEX_STATUS=":ballot_box_with_check:"
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Dogfooding Scorecard

          **Score: ${SCORE}/${MAX}**

          | Tool/Format | Status | Notes |
          |-------------|--------|-------|
          | DEED repo deed (\`<reponame>_chora.deed\`) | ${DEED_STATUS} | Required for all RSR repos |
          | K9 contracts | ${K9_STATUS} | Required for repos with config files |
          | .editorconfig | ${EC_STATUS} | Required for all repos |
          | Groove endpoint | ${GROOVE_STATUS} | Required for service repos |
          | VeriSimDB integration | ${VSDB_STATUS} | Required for stateful repos |
          | eclexiaiser | ${ECLEX_STATUS} | Energy/carbon budgets for container services |
          EOF

  rsr-score-self:
    name: RSR oracle — dogfood this repo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: 8e48b1caade08a552646adeab66558ac43b4360d
          path: _standards
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/hypatia
          ref: be98f74ce93df200752f3798efa1305bfa3e0e10
          path: _hypatia
          persist-credentials: false
      - name: Setup Elixir 1.19.4 / OTP 28.3 for Hypatia oracle
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Cache Hypatia Mix deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _hypatia/deps
            _hypatia/_build
            ~/.hex
            ~/.mix
          key: hypatia-oracle-${{ runner.os }}-otp28-elx1194-be98f74ce93df200752f3798efa1305bfa3e0e10
      - name: Compile the oracle
        working-directory: _hypatia
        run: mix local.hex --force && mix local.rebar --force && mix deps.get && mix compile
      - name: Score this repo against the canon
        working-directory: _hypatia
        run: |
          mix hypatia.rsr_score ../subject \
            --ssot ../_standards/0-canon/rsr/rsr-criteria-v2.a2ml
